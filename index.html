<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>AI Avatar Assistant</title>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
          "@pixiv/three-vrm": "https://unpkg.com/@pixiv/three-vrm@2.0.0/lib/three-vrm.module.js"
        }
      }
    </script>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; background-color: #222; }
        #ui-container { position: absolute; top: 10px; left: 10px; z-index: 10; background: rgba(0,0,0,0.7); padding: 15px; border-radius: 8px; color: white; width: 300px; }
        #chat-log { height: 150px; overflow-y: auto; margin: 10px 0; border: 1px solid #555; padding: 5px; font-size: 14px; }
        button, input { padding: 5px 10px; margin-top: 5px; width: 100%; box-sizing: border-box; }
    </style>
</head>
<body>
    <div id="ui-container">
        <button id="start-btn">システム起動（カメラ・マイク許可）</button>
        <div id="chat-log"></div>
        <input type="text" id="chat-input" placeholder="メッセージを入力してEnter" disabled>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { VRMLoaderPlugin } from '@pixiv/three-vrm';

        // --- UI要素 ---
        const startBtn = document.getElementById('start-btn');
        const chatLog = document.getElementById('chat-log');
        const chatInput = document.getElementById('chat-input');
        
        // --- システム変数 ---
        const ws = new WebSocket('ws://localhost:8000/ws');
        let isStarted = false;
        let currentVrm = null;

        // --- 1. Three.js & VRM のセットアップ ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(30, window.innerWidth / window.innerHeight, 0.1, 20);
        camera.position.set(0, 1.3, 3);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const light = new THREE.DirectionalLight(0xffffff, 2.0);
        light.position.set(1, 1, 1).normalize();
        scene.add(light);

        // VRMの読み込み（同じフォルダに avatar.vrm を置いてください）
        const loader = new GLTFLoader();
        loader.register((parser) => new VRMLoaderPlugin(parser));
        loader.load('./avatar.vrm', (gltf) => {
            const vrm = gltf.userData.vrm;
            scene.add(vrm.scene);
            currentVrm = vrm;
            vrm.scene.rotation.y = Math.PI; // 正面を向かせる
        }, undefined, (error) => console.error('VRM読み込みエラー:', error));

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const deltaTime = clock.getDelta();
            if (currentVrm) currentVrm.update(deltaTime);
            renderer.render(scene, camera);
        }
        animate();

        // --- 2. WebSocketの受信処理（音声再生） ---
        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            if (data.type === 'audio') {
                appendMessage('ai', data.text);
                // Pythonから送られてきたBase64音声を再生
                const audio = new Audio("data:audio/mp3;base64," + data.audio);
                audio.play();
            }
        };

        // --- 3. システム起動とカメラ処理 ---
        startBtn.addEventListener('click', () => {
            startBtn.disabled = true;
            startBtn.innerText = "起動中...";
            chatInput.disabled = false;
            isStarted = true;

            appendMessage('status', "カメラを起動しています...");

            // カメラの取得と送信
            navigator.mediaDevices.getUserMedia({ video: true }).then(stream => {
                const video = document.createElement('video');
                video.autoplay = true;
                video.playsInline = true;
                video.srcObject = stream;
                video.play();

                // 10秒ごとにカメラ映像をPythonサーバーへ送信
                setInterval(() => {
                    if (ws.readyState === WebSocket.OPEN) {
                        const canvas = document.createElement('canvas');
                        canvas.width = 320; canvas.height = 240;
                        canvas.getContext('2d').drawImage(video, 0, 0, 320, 240);
                        const imageData = canvas.toDataURL('image/jpeg').split(',')[1];
                        ws.send(JSON.stringify({ type: 'vision_frame', data: imageData }));
                    }
                }, 10000);

                appendMessage('status', "システム正常稼働。10秒ごとに映像を解析します。");
            }).catch(err => {
                appendMessage('status', "カメラの起動に失敗しました。");
            });
        });

        // --- 4. テキストチャット送信 ---
        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && chatInput.value.trim() !== '') {
                const text = chatInput.value.trim();
                appendMessage('user', text);
                ws.send(JSON.stringify({ type: 'text', text: text }));
                chatInput.value = '';
            }
        });

        // --- 補助関数 ---
        function appendMessage(role, text) {
            const div = document.createElement('div');
            div.style.color = role === 'user' ? '#88ccff' : (role === 'ai' ? '#ffcc88' : '#cccccc');
            div.innerText = `${role === 'user' ? 'あなた' : (role === 'ai' ? 'AI' : 'システム')}: ${text}`;
            chatLog.appendChild(div);
            chatLog.scrollTop = chatLog.scrollHeight;
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
