<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js + Camera</title>
    
    <!-- 💡 エラーの原因になりやすい「モジュールの場所」をブラウザに教える設定 -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
          "@pixiv/three-vrm": "https://unpkg.com/@pixiv/three-vrm@2.0.0/lib/three-vrm.module.js"
        }
      }
    </script>
</head>
<body>
    <!-- 💡 スクリプトで読み込んでいるボタンや表示エリア（すでに準備済みの場合は置き換えてください） -->
    <button id="start-btn">スタート</button>
    <div id="chat-log" style="margin-top: 20px; border: 1px solid #ccc; min-height: 100px; padding: 10px;"></div>
    <div id="mic-indicator"></div>
    <div id="options-overlay"></div>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { VRMLoaderPlugin } from '@pixiv/three-vrm';

        // --- 変数定義 ---
        const ws = new WebSocket('ws://localhost:8000/ws');
        const startBtn = document.getElementById('start-btn');
        const chatLog = document.getElementById('chat-log');
        const micIndicator = document.getElementById('mic-indicator');
        const optionsOverlay = document.getElementById('options-overlay');
        let isStarted = false;
        let isSpeaking = false;
        let isOptionsOpen = false;
        let audioCtx = null;

        // --- activateSystem の修正版 ---
        function activateSystem() {
            if (!startBtn || startBtn.disabled) return;
            startBtn.disabled = true;
            startBtn.style.display = 'none'; 
            
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            isStarted = true;
            
            if (chatLog) chatLog.innerHTML = "";
            appendMessage('status', "カメラと音声で対話開始...");

            // 💡 カメラ送信処理の修正（autoplay と playsInline を追加して映像が真っ暗になるのを防ぐ）
            navigator.mediaDevices.getUserMedia({ video: true }).then(stream => {
                const video = document.createElement('video');
                video.autoplay = true;       // 【追加】自動再生
                video.playsInline = true;    // 【追加】インライン再生
                video.srcObject = stream;
                video.play();
                
                setInterval(() => {
                    if (!isStarted || isOptionsOpen) return;
                    const canvas = document.createElement('canvas');
                    canvas.width = 320; canvas.height = 240;
                    canvas.getContext('2d').drawImage(video, 0, 0, 320, 240);
                    const imageData = canvas.toDataURL('image/jpeg').split(',')[1];
                    if (ws.readyState === WebSocket.OPEN) {
                        ws.send(JSON.stringify({ type: 'vision_frame', data: imageData }));
                    }
                }, 10000); 
            }).catch(err => {
                console.error("カメラの取得に失敗しました:", err);
                appendMessage('status', "カメラの取得に失敗しました。設定を確認してください。");
            });

            // 💡 未定義エラー（ReferenceError）を防ぐため、一旦コメントアウトしています。
            // もし別の場所にこれらの関数を作っている場合は、先頭の「//」を消してください。
            // sendSettingsToServer();
            // startListening();
        }

        // startBtn にイベントを登録
        if (startBtn) {
            startBtn.addEventListener('click', activateSystem);
        }

        // --- 必要な補助関数 ---
        function appendMessage(role, text) {
            if (!isStarted && role !== 'status') return null;
            const msgDiv = document.createElement('div');
            msgDiv.className = role === 'user' ? 'msg-user' : (role === 'ai' ? 'msg-ai' : 'msg-status');
            msgDiv.innerText = text;
            if(chatLog) chatLog.appendChild(msgDiv);
            return msgDiv;
        }

        // ... (その他、既存の animate や ws.onmessage などの関数はここに続けて記述してください)
    </script>
</body>
</html>
